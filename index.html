<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agenda — Implantação de IA</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f0; --surface: #ffffff; --border: #e0ddd6; --border-strong: #c8c4bc;
    --text: #1a1916; --text-muted: #6b6860; --text-hint: #a8a49e; --accent: #1a1916;
    --radius: 10px; --radius-lg: 14px;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem 1rem 4rem; }
  .page { max-width: 920px; margin: 0 auto; }
  header { margin-bottom: 2rem; }
  header h1 { font-size: 22px; font-weight: 500; letter-spacing: -0.3px; }
  header p { font-size: 14px; color: var(--text-muted); margin-top: 4px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 2rem; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .stat-val { font-size: 26px; font-weight: 500; letter-spacing: -0.5px; }
  .stat-lbl { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .week-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .week-btn { padding: 8px 18px; border: 1px solid var(--border); border-radius: 20px; background: transparent; color: var(--text-muted); font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.15s; }
  .week-btn:hover { border-color: var(--border-strong); color: var(--text); }
  .week-btn.active { color: #fff; border-color: transparent; }
  .week-info { display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); }
  .week-info-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .week-info p { font-size: 13px; color: var(--text-muted); }
  .week-info strong { color: var(--text); font-weight: 500; }
  .days-grid { display: grid; gap: 10px; }
  .day-col { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
  .day-header { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 8px; }
  .day-name { font-size: 12px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .day-date { font-size: 15px; font-weight: 500; }
  .day-slots { padding: 10px; display: grid; gap: 8px; }
  .slot { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
  .slot-time { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; }
  .slot-name { font-size: 12px; color: var(--text-muted); margin: 3px 0 8px; min-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot-btn { width: 100%; padding: 5px; border: 1px solid var(--border); border-radius: 6px; background: transparent; font-size: 11px; color: var(--text-muted); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .slot-btn:hover { background: var(--bg); border-color: var(--border-strong); color: var(--text); }
  .slot-btn.cancel { border-color: #f0bdb4; color: #7a2015; }
  .slot-btn.cancel:hover { background: #fdf0ee; }
  .period-sep { font-size: 10px; font-weight: 500; color: var(--text-hint); text-transform: uppercase; letter-spacing: 0.08em; padding: 2px 2px 0; }
  .overlay { display: none; position: fixed; inset: 0; background: rgba(26,25,22,0.4); z-index: 100; align-items: center; justify-content: center; }
  .overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; width: 340px; max-width: 92vw; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
  .modal h3 { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
  .modal .modal-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 18px; }
  .modal input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--text); background: var(--bg); margin-bottom: 14px; outline: none; transition: border-color 0.15s; }
  .modal input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; }
  .modal-actions button { flex: 1; padding: 9px; border-radius: var(--radius); font-size: 14px; font-family: 'DM Sans', sans-serif; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text); transition: all 0.15s; }
  .modal-actions button:hover { background: var(--bg); }
  .modal-actions .btn-confirm { color: #fff; border-color: transparent; font-weight: 500; }
  .modal-actions .btn-confirm:hover { opacity: 0.88; }
  @media (max-width: 600px) { .days-grid { grid-template-columns: 1fr !important; } }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Agenda de implantação — IA na empresa</h1>
    <p>Sessões de 1 hora · dias úteis</p>
  </header>
  <div class="stats" id="stats"></div>
  <div class="week-tabs" id="weekTabs"></div>
  <div class="week-info" id="weekInfo"></div>
  <div class="days-grid" id="daysGrid"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <p class="modal-sub" id="modal-sub"></p>
    <input type="text" id="modal-name" placeholder="Seu nome completo" maxlength="40" />
    <div class="modal-actions">
      <button onclick="closeModal()">Cancelar</button>
      <button class="btn-confirm" id="btn-confirm" onclick="confirmBook()">Confirmar</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA0r9ra1d-BKzwC1jx_ru38Yv2PSYwezS0",
    authDomain: "agenda-ia-44a4b.firebaseapp.com",
    databaseURL: "https://agenda-ia-44a4b-default-rtdb.firebaseio.com",
    projectId: "agenda-ia-44a4b",
    storageBucket: "agenda-ia-44a4b.firebasestorage.app",
    messagingSenderId: "1050669334660",
    appId: "1:1050669334660:web:26c9d3044571bc9d04c2d1"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const WEEKS = [
    {
      label: 'Diretoria e Líderes',
      group: 'Diretoria e Líderes',
      color: '#185fa5',
      dot: '#378add',
      light: '#eef4fb',
      times: ['09:00','14:00'],
      days: [
        { name: 'Qui', date: '15/05' },
        { name: 'Sex', date: '16/05' },
        { name: 'Seg', date: '19/05' },
        { name: 'Ter', date: '20/05' },
        { name: 'Qua', date: '21/05' },
      ]
    },
    {
      label: 'Escritório',
      group: 'Escritório',
      color: '#3c1a6b',
      dot: '#7f77dd',
      light: '#f3eefb',
      times: ['09:00','13:00','16:00'],
      days: [
        { name: 'Qui', date: '22/05' },
        { name: 'Sex', date: '23/05' },
        { name: 'Seg', date: '26/05' },
        { name: 'Ter', date: '27/05' },
        { name: 'Qua', date: '28/05' },
      ]
    },
    {
      label: 'House',
      group: 'House',
      color: '#854f0b',
      dot: '#ef9f27',
      light: '#fdf6e8',
      times: ['09:00','10:00','11:00','14:00','15:00','16:00'],
      days: [
        { name: 'Qui', date: '29/05' },
        { name: 'Sex', date: '30/05' },
      ]
    }
  ];

  let state = {};
  WEEKS.forEach((w, wi) => {
    w.days.forEach((d, di) => {
      w.times.forEach(t => { state[wi+'_'+di+'_'+t.replace(':','')] = null; });
    });
  });

  let activeWeek = 0;
  let pendingKey = null;

  const dbRef = ref(db, 'agenda_v3');
  onValue(dbRef, (snapshot) => {
    const data = snapshot.val();
    WEEKS.forEach((w, wi) => {
      w.days.forEach((d, di) => {
        w.times.forEach(t => { state[wi+'_'+di+'_'+t.replace(':','')] = null; });
      });
    });
    if (data) {
      Object.entries(data).forEach(([key, name]) => {
        if (key in state) state[key] = name;
      });
    }
    render();
  });

  function render() { renderTabs(); renderStats(); renderWeekInfo(); renderDays(); }

  function renderTabs() {
    document.getElementById('weekTabs').innerHTML = WEEKS.map((w, i) =>
      `<button class="week-btn${i===activeWeek?' active':''}" style="${i===activeWeek?'background:'+w.color+';':''}" onclick="setWeek(${i})">${w.label}</button>`
    ).join('');
  }

  function renderWeekInfo() {
    const w = WEEKS[activeWeek];
    const timesStr = w.times.map(t => t + 'h').join(' &nbsp;·&nbsp; ');
    document.getElementById('weekInfo').innerHTML =
      `<div class="week-info-dot" style="background:${w.dot}"></div>
       <p>Grupo: <strong>${w.group}</strong> &nbsp;·&nbsp; Horários: <strong>${timesStr}</strong> &nbsp;·&nbsp; Sessão de <strong>1 hora</strong></p>`;
  }

  function renderStats() {
    let total=0, booked=0;
    Object.values(state).forEach(v => { total++; if(v) booked++; });
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="stat-val">${total}</div><div class="stat-lbl">Total de vagas</div></div>
      <div class="stat"><div class="stat-val">${booked}</div><div class="stat-lbl">Agendados</div></div>
      <div class="stat"><div class="stat-val">${total-booked}</div><div class="stat-lbl">Disponíveis</div></div>
    `;
  }

  function buildSlot(wi, di, t, w) {
    const key = wi+'_'+di+'_'+t.replace(':','');
    const name = state[key];
    const ok = !!name;
    const bookedStyle = ok ? 'background:'+w.light+';border-color:'+w.dot+';' : '';
    const nameStyle = ok ? 'color:'+w.color+';font-weight:500;' : '';
    const timeStyle = ok ? 'color:'+w.color+';' : '';
    const dayDate = WEEKS[wi].days[di].date;
    const btn = ok
      ? `<button class="slot-btn cancel" onclick="cancelSlot('${key}')">Cancelar</button>`
      : `<button class="slot-btn" onclick="openModal('${key}','${t}','${dayDate}')">+ Agendar</button>`;
    return `<div class="slot" style="${bookedStyle}">
      <div class="slot-time" style="${timeStyle}">${t}</div>
      <div class="slot-name" style="${nameStyle}">${name||''}</div>
      ${btn}
    </div>`;
  }

  function renderDays() {
    const wi = activeWeek;
    const w = WEEKS[wi];
    const cols = w.days.length;
    document.getElementById('daysGrid').style.gridTemplateColumns = 'repeat('+cols+', 1fr)';

    document.getElementById('daysGrid').innerHTML = w.days.map((d, di) => {
      let slotsHtml = '';

      if (wi === 2) {
        slotsHtml += '<div class="period-sep">Manhã</div>';
        ['09:00','10:00','11:00'].forEach(t => { slotsHtml += buildSlot(wi, di, t, w); });
        slotsHtml += '<div class="period-sep" style="margin-top:4px;">Tarde</div>';
        ['14:00','15:00','16:00'].forEach(t => { slotsHtml += buildSlot(wi, di, t, w); });
      } else {
        w.times.forEach(t => { slotsHtml += buildSlot(wi, di, t, w); });
      }

      return `<div class="day-col">
        <div class="day-header">
          <div class="day-name">${d.name}</div>
          <div class="day-date">${d.date}</div>
        </div>
        <div class="day-slots">${slotsHtml}</div>
      </div>`;
    }).join('');
  }

  window.setWeek = (i) => { activeWeek = i; render(); };

  window.openModal = (key, time, date) => {
    pendingKey = key;
    const w = WEEKS[activeWeek];
    document.getElementById('modal-title').textContent = 'Agendar ' + time;
    document.getElementById('modal-sub').textContent = date + ' · ' + w.group + ' · 1 hora';
    document.getElementById('modal-name').value = '';
    document.getElementById('btn-confirm').style.background = w.color;
    document.getElementById('overlay').classList.add('open');
    setTimeout(() => document.getElementById('modal-name').focus(), 50);
  };

  window.closeModal = () => {
    document.getElementById('overlay').classList.remove('open');
    pendingKey = null;
  };

  window.confirmBook = async () => {
    const name = document.getElementById('modal-name').value.trim();
    if (!name) { document.getElementById('modal-name').focus(); return; }
    await set(ref(db, 'agenda_v3/' + pendingKey), name);
    closeModal();
  };

  window.cancelSlot = async (key) => {
    await remove(ref(db, 'agenda_v3/' + key));
  };

  document.getElementById('modal-name').addEventListener('keydown', e => { if(e.key==='Enter') window.confirmBook(); });
  document.getElementById('overlay').addEventListener('click', e => { if(e.target===document.getElementById('overlay')) window.closeModal(); });
</script>
</body>
</html>
